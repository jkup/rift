name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CCACHE_DIR: ~/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: ${{ runner.os }}-apt-quality-v1
        restore-keys: |
          ${{ runner.os }}-apt-quality-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cppcheck \
          clang-format \
          cmake \
          build-essential \
          g++

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=g++

    - name: Format and check code
      run: |
        cd build
        make format
        make format-check

    - name: Run static analysis
      run: |
        cd build
        make cppcheck

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [g++, clang++]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
        max-size: 500M

    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ matrix.compiler }}-${{ matrix.build_type }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          g++ \
          clang

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run full test suite
      run: npm test

  sanitizer:
    name: Sanitizer Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-sanitizer
        max-size: 500M

    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-sanitizer-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-sanitizer-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          clang

    - name: Configure CMake with sanitizers
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_SANITIZERS=ON

    - name: Build with sanitizers
      run: |
        cd build
        make -j$(nproc)

    - name: Run test suite with sanitizers
      run: npm test 