name: Test262 Quick Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'test262-runner.js'
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Test pattern (e.g., language/expressions/addition)'
        required: false
        default: 'language/expressions/addition'

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  quick-test262:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang bc
    
    - name: Build runtime
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
        make -j$(nproc)
    
    - name: Run quick Test262 subset
      id: quick-test
      run: |
        # Run a focused subset of tests for quick feedback
        TEST_PATTERN="${{ github.event.inputs.test_pattern || 'language/expressions/addition' }}"
        
        echo "🚀 Running Test262 subset: $TEST_PATTERN"
        node test262-runner.js --include="$TEST_PATTERN" > quick-results.txt 2>&1 || true
        
        # Extract results
        PASSED=$(grep -o "Passed: [0-9]*" quick-results.txt | grep -o "[0-9]*" || echo "0")
        FAILED=$(grep -o "Failed: [0-9]*" quick-results.txt | grep -o "[0-9]*" || echo "0")
        TOTAL=$((PASSED + FAILED))
        
        if [ $TOTAL -gt 0 ]; then
          PASS_RATE=$(echo "scale=1; $PASSED * 100 / $TOTAL" | bc -l)
        else
          PASS_RATE="0"
        fi
        
        echo "✅ Quick results: $PASSED/$TOTAL passed ($PASS_RATE%)"
        
        # Output for GitHub
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
        echo "pattern=$TEST_PATTERN" >> $GITHUB_OUTPUT
    
    - name: Comment quick results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const passed = ${{ steps.quick-test.outputs.passed }};
          const total = ${{ steps.quick-test.outputs.total }};
          const passRate = '${{ steps.quick-test.outputs.pass_rate }}';
          const pattern = '${{ steps.quick-test.outputs.pattern }}';
          
          const emoji = passed > 0 ? '✅' : '❌';
          const status = passed === total ? 'All tests passing!' : `${passed}/${total} tests passing`;
          
          const comment = `## 🚀 Quick Test262 Check
          
          **Pattern:** \`${pattern}\`  
          **Result:** ${emoji} ${status} (${passRate}%)
          
          ${passed > 0 ? '🎉 Some tests are passing!' : '⚠️ No tests passing yet - this is normal for new features.'}
          
          *For full Test262 results, wait for the complete compatibility report.*`;
          
          // Find and update existing quick check comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const quickComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🚀 Quick Test262 Check')
          );
          
          if (quickComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: quickComment.id,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
          }
    
    - name: Upload quick results
      uses: actions/upload-artifact@v4
      with:
        name: test262-quick-results
        path: quick-results.txt
        retention-days: 7 