name: Test262 Compatibility Report

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'test262-runner.js'
      - 'package.json'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'test262-runner.js'
      - 'package.json'
  workflow_dispatch: # Allow manual triggers

env:
  CMAKE_BUILD_TYPE: Release
  TEST262_TIMEOUT: 30m

jobs:
  test262-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Need full history for comparison
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang
    
    - name: Build runtime (PR branch)
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
        make -j$(nproc)
        echo "✅ PR branch runtime built successfully"
    
    - name: Run Test262 on PR branch
      id: test262-pr
      timeout-minutes: 30
      run: |
        echo "🔬 Running Test262 on PR branch..."
        npm run test262 > test262-pr-results.txt 2>&1 || true
        
        # Extract key metrics
        PASSED=$(grep -o "Passed: [0-9]*" test262-pr-results.txt | grep -o "[0-9]*" || echo "0")
        FAILED=$(grep -o "Failed: [0-9]*" test262-pr-results.txt | grep -o "[0-9]*" || echo "0")
        TOTAL=$((PASSED + FAILED))
        PASS_RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc -l 2>/dev/null || echo "0")
        
        echo "pr_passed=$PASSED" >> $GITHUB_OUTPUT
        echo "pr_failed=$FAILED" >> $GITHUB_OUTPUT
        echo "pr_total=$TOTAL" >> $GITHUB_OUTPUT
        echo "pr_pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
        
        echo "📊 PR Results: $PASSED/$TOTAL passed ($PASS_RATE%)"
    
    - name: Stash PR results
      run: |
        cp test262-pr-results.txt /tmp/
        cp build/rift /tmp/rift-pr || true
    
    - name: Checkout main branch
      run: |
        git checkout main
        git clean -fd
    
    - name: Build runtime (main branch)
      run: |
        rm -rf build
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
        make -j$(nproc)
        echo "✅ Main branch runtime built successfully"
    
    - name: Run Test262 on main branch
      id: test262-main
      timeout-minutes: 30
      run: |
        echo "🔬 Running Test262 on main branch..."
        npm run test262 > test262-main-results.txt 2>&1 || true
        
        # Extract key metrics
        PASSED=$(grep -o "Passed: [0-9]*" test262-main-results.txt | grep -o "[0-9]*" || echo "0")
        FAILED=$(grep -o "Failed: [0-9]*" test262-main-results.txt | grep -o "[0-9]*" || echo "0")
        TOTAL=$((PASSED + FAILED))
        PASS_RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc -l 2>/dev/null || echo "0")
        
        echo "main_passed=$PASSED" >> $GITHUB_OUTPUT
        echo "main_failed=$FAILED" >> $GITHUB_OUTPUT
        echo "main_total=$TOTAL" >> $GITHUB_OUTPUT
        echo "main_pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
        
        echo "📊 Main Results: $PASSED/$TOTAL passed ($PASS_RATE%)"
    
    - name: Generate comparison report
      id: comparison
      run: |
        cp /tmp/test262-pr-results.txt .
        
        # Calculate differences (with safe defaults)
        PR_PASSED="${{ steps.test262-pr.outputs.pr_passed || '0' }}"
        MAIN_PASSED="${{ steps.test262-main.outputs.main_passed || '0' }}"
        PR_TOTAL="${{ steps.test262-pr.outputs.pr_total || '0' }}"
        MAIN_TOTAL="${{ steps.test262-main.outputs.main_total || '0' }}"
        PR_RATE="${{ steps.test262-pr.outputs.pr_pass_rate || '0' }}"
        MAIN_RATE="${{ steps.test262-main.outputs.main_pass_rate || '0' }}"
        
        PASSED_DIFF=$((PR_PASSED - MAIN_PASSED))
        RATE_DIFF=$(echo "scale=2; $PR_RATE - $MAIN_RATE" | bc -l 2>/dev/null || echo "0")
        
        echo "passed_diff=$PASSED_DIFF" >> $GITHUB_OUTPUT
        echo "rate_diff=$RATE_DIFF" >> $GITHUB_OUTPUT
        
        # Determine status emoji and message
        if (( PASSED_DIFF > 0 )); then
          STATUS="🎉 IMPROVEMENT"
          COLOR="28a745"
        elif (( PASSED_DIFF < 0 )); then
          STATUS="⚠️ REGRESSION"  
          COLOR="d73a49"
        else
          STATUS="➡️ NO CHANGE"
          COLOR="6f42c1"
        fi
        
        echo "status=$STATUS" >> $GITHUB_OUTPUT
        echo "color=$COLOR" >> $GITHUB_OUTPUT
        
        # Create detailed report
        cat > comparison-report.md << 'EOF'
        # 🧪 Test262 Compatibility Report
        
        ## 📊 Results Summary
        
        | Branch | Passed | Failed | Total | Pass Rate | 
        |--------|--------|--------|-------|-----------|
        | **PR** | $PR_PASSED | ${{ steps.test262-pr.outputs.pr_failed }} | $PR_TOTAL | $PR_RATE% |
        | **Main** | $MAIN_PASSED | ${{ steps.test262-main.outputs.main_failed }} | $MAIN_TOTAL | $MAIN_RATE% |
        | **Diff** | **$PASSED_DIFF** | | | **$RATE_DIFF%** |
        
        ## $STATUS
        
        EOF
        
        if (( PASSED_DIFF > 0 )); then
          cat >> comparison-report.md << 'EOF'
        🎉 **Congratulations!** This PR improves JavaScript compatibility by fixing additional test262 tests.
        
        ### What improved:
        EOF
        elif (( PASSED_DIFF < 0 )); then
          cat >> comparison-report.md << 'EOF'
        ⚠️ **Warning:** This PR appears to break some previously passing test262 tests. Please review the changes.
        
        ### What regressed:
        EOF
        else
          cat >> comparison-report.md << 'EOF'
        ➡️ This PR maintains the current level of JavaScript compatibility without significant changes to test262 results.
        EOF
        fi
        
        # Add test details if there are differences
        if (( PASSED_DIFF != 0 )); then
          echo "" >> comparison-report.md
          echo "### 📋 Test Details" >> comparison-report.md
          echo "" >> comparison-report.md
          echo "\`\`\`" >> comparison-report.md
          echo "Tests affected: $PASSED_DIFF" >> comparison-report.md
          echo "Pass rate change: $RATE_DIFF%" >> comparison-report.md
          echo "\`\`\`" >> comparison-report.md
        fi
        
        echo "" >> comparison-report.md
        echo "---" >> comparison-report.md
        echo "*Report generated by GitHub Actions on $(date)*" >> comparison-report.md
    
    - name: Upload test results as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test262-results
        path: |
          test262-pr-results.txt
          test262-main-results.txt
          comparison-report.md
        retention-days: 30
    
    - name: Comment on PR (if this is a PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportContent = fs.readFileSync('comparison-report.md', 'utf8');
          
          // Find existing comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🧪 Test262 Compatibility Report')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: reportContent
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reportContent
            });
          }
    
    - name: Create status check
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const passedDiff = parseInt('${{ steps.comparison.outputs.passed_diff }}') || 0;
          const status = '${{ steps.comparison.outputs.status }}' || 'unknown';
          
          let state, description;
          if (passedDiff > 0) {
            state = 'success';
            description = `✅ Improved: +${passedDiff} tests passing`;
          } else if (passedDiff < 0) {
            state = 'failure'; 
            description = `❌ Regression: ${passedDiff} tests failing`;
          } else {
            state = 'success';
            description = '➡️ No change in test262 compatibility';
          }
          
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: state,
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            description: description,
            context: 'test262-compatibility'
          });
    
    - name: Save baseline (if main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p .github/test262-baselines
        cp test262-main-results.txt .github/test262-baselines/latest.txt
        echo "${{ steps.test262-main.outputs.main_passed }}" > .github/test262-baselines/latest-count.txt
        echo "💾 Saved new baseline: ${{ steps.test262-main.outputs.main_passed }} tests passing" 